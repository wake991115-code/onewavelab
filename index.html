<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ONE WAVE LAB — 玩味·视觉设计工作室</title>
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0f0e; --ink:#f4f2ec; --mut:rgba(244,242,236,.52); --line:rgba(255,255,255,.15);
    --grad:linear-gradient(100deg,#ffffff,#9c9a90);
    --serif:"Noto Serif SC",Georgia,serif;
    --sans:"Inter","Helvetica Neue","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{margin:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  ::selection{background:rgba(255,255,255,.2)}

  /* 顶栏 */
  .topbar{position:sticky;top:0;z-index:40;height:66px;display:flex;align-items:center;
    justify-content:space-between;padding:0 40px;
    background:rgba(15,15,14,.82);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:11px;font-weight:500;letter-spacing:.22em;font-size:14px}
  .navlink{font-size:12px;letter-spacing:.14em;color:var(--mut);transition:color .25s}
  .navlink:hover{color:var(--ink)}
  .navlinks{display:flex;align-items:center;gap:28px}
  .navlink.active{color:var(--ink)}

  .wrap{max-width:1320px;margin:0 auto;padding:0 40px}

  /* 头部 */
  .hero{padding:84px 0 30px}
  .hero .rule{height:1px;background:var(--line);margin-bottom:30px}
  .hero .kicker{font-size:11px;letter-spacing:.34em;color:var(--mut);margin-bottom:22px}
  .hero h1{font-family:var(--serif);font-weight:500;
    font-size:clamp(32px,5vw,64px);line-height:1.06;letter-spacing:-.012em}
  .hero h1 em{font-style:normal;background:var(--grad);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero-meta{display:flex;flex-wrap:wrap;margin-top:30px;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .hero-meta span{flex:1;min-width:140px;padding:16px 0;font-size:11px;letter-spacing:.16em;
    color:var(--mut);text-transform:uppercase}
  .hero-meta span + span{border-left:1px solid var(--line);padding-left:22px}

  /* 区块标签 */
  .sect-label{display:flex;justify-content:space-between;align-items:baseline;
    padding:46px 0 16px;font-size:11px;letter-spacing:.2em;color:var(--mut)}

  /* 品牌 logo 墙（纯展示，不跳转） */
  .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:1px;background:var(--line);border:1px solid var(--line)}
  .tile{position:relative;background:var(--bg);aspect-ratio:1;display:flex;
    flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:22px;transition:background .35s,color .35s}
  .tile:hover{background:var(--ink);color:var(--bg)}
  .tile .logoimg{max-width:92%;max-height:82%;object-fit:contain;filter:grayscale(1);transition:filter .35s}
  .tile:hover .logoimg{filter:grayscale(1) invert(1)}

  @media(max-width:640px){
    .topbar,.wrap{padding-left:18px;padding-right:18px}
    .hero{padding:52px 0 24px}
    .wall{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="logo" href="index.html">ONE WAVE LAB</a>
    <nav class="navlinks">
      <a class="navlink" href="home.html">Work</a>
      <a class="navlink" href="contact.html">Contact</a>
    </nav>
  </div>

  <div class="wrap">
    <header class="hero">
      <div class="rule"></div>
      <div class="kicker">ONE WAVE LAB — 玩味·视觉设计工作室</div>
      <h1>懂美学，更懂生意！<br/>为客户提供品牌长期主义价值</h1>
      <div class="hero-meta">
        <span>2020 - 2026</span>
        <span>南京 · 合肥</span>
        <span>品牌咨询 · 品牌设计 · 空间设计</span>
      </div>
    </header>

    <div class="sect-label"><span>COLLABORATORS — 合作品牌</span></div>
    <main class="wall" id="wall"></main>
  </div>

  <script>
    const wall = document.getElementById('wall');
    // 首页 logo 墙：按顺序展示 36 张合作品牌 logo，纯展示、不可点击
    const logos = [];
    for(let i=1;i<=36;i++) logos.push('logo_'+i+'.webp');
    logos.forEach((src,i)=>{
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = '<img class="logoimg" src="images/logos/'+src+'" alt="logo '+(i+1)+'">';
      wall.appendChild(tile);
    });
  </script>
</body>
</html>
